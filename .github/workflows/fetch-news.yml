name: Fetch news

on:
  schedule:
    - cron: "*/30 * * * *"   # প্রতি ৩০ মিনিটে
  workflow_dispatch: {}      # Actions ট্যাব থেকে হাতেও চালানো যাবে

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install
        run: pip install -r scripts/requirements.txt

      - name: Fetch & summarize news
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: python scripts/fetch_news.py

      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "নতুন কিছু নেই"
          else
            git commit -m "news: update $(date -u +'%Y-%m-%d %H:%M')"
            # এর মধ্যে অ্যাডমিন প্যানেল থেকে কিছু সেভ হলে সেটা আগে টেনে নেওয়া
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
